name: Build Mohasiba APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Verify Dart project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate modern Android project files
        run: |
          cp lib/main.dart /tmp/mohasiba_main.dart
          flutter create --platforms=android .
          cp /tmp/mohasiba_main.dart lib/main.dart

      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          if p.exists():
              s = p.read_text(encoding="utf-8")
              s = s.replace('android:label="app"', 'android:label="Mohasiba"')
              p.write_text(s, encoding="utf-8")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohasiba-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
